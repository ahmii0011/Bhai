<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Message For Muhtarma 🌙✨</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: radial-gradient(circle at center, #1b1b2f, #161622, #0d0d15);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #f5f5f7;
            overflow-x: hidden;
            padding: 20px;
        }
        .wrapper {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 35px 25px;
            border-radius: 30px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
            max-width: 440px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 2;
        }
        .tag {
            background: rgba(212, 175, 55, 0.15);
            color: #ffd700;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            display: inline-block;
            margin-bottom: 20px;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }
        h1 {
            font-size: 24px;
            color: #ffffff;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .sub {
            font-size: 13px;
            color: #9ba1a6;
            margin-bottom: 30px;
        }
        .note-card {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            padding: 25px 20px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        #messageBox {
            font-size: 16px;
            line-height: 1.7;
            color: #e2e8f0;
            transition: all 0.3s ease;
        }
        .action-btn {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.3);
            transition: transform 0.2s, opacity 0.2s;
        }
        .action-btn:active {
            transform: scale(0.97);
        }
        .counter {
            margin-top: 15px;
            font-size: 12px;
            color: #64748b;
        }
        /* Star Effect */
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite ease-in-out;
            z-index: 1;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }
    </style>
</head>
<body>

    <!-- Background Stars -->
    <script>
        for (let i = 0; i < 25; i++) {
            let star = document.createElement('div');
            star.className = 'star';
            star.style.width = Math.random() * 3 + 'px';
            star.style.height = star.style.width;
            star.style.top = Math.random() * 100 + 'vh';
            star.style.left = Math.random() * 100 + 'vw';
            star.style.animationDuration = (Math.random() * 2 + 2) + 's';
            document.body.appendChild(star);
        }
    </script>

    <div class="wrapper">
        <div class="tag">✨ Exclusive For Muhtarma ✨</div>
        <h1>Kuch Khaas Baatein</h1>
        <p class="sub">Tap karke dekho, har note mein ek alag hi vibe hai! 🤍</p>

        <div class="note-card">
            <p id="messageBox">Suno Muhtarma... Aapki presence hi sab kuch itna peaceful bana deti hai. 🌙✨</p>
        </div>

        <button class="action-btn" onclick="nextNote()">Agli Baat Padho 💌</button>
        <div class="counter" id="counterText">Note 1 of 5</div>
    </div>

    <script>
        const notes = [
            "Suno Muhtarma... Aapki presence hi sab kuch itna peaceful bana deti hai. 🌙✨",
            "Aapki baaton mein aisi ajeeb si khichav aur sukoon hai jo kahin aur nahi milta. 🕊️💫",
            "Kabhi socha nahi tha ke koi itna random hokar bhi itna special ban sakta hai! 🦋",
            "Aapki muskaan dekh kar lagta hai ke duniya ki saari fikar bekaar hai. ☕🤍",
            "Bas yunhi hasti raho, kyunki ye smile aap par sabse zyada jachti hai! ✨"
        ];

        let index = 0;

        function nextNote() {
            index = (index + 1) % notes.length;
            const box = document.getElementById("messageBox");
            box.style.opacity = 0;
            box.style.transform = "translateY(10px)";
            
            setTimeout(() => {
                box.innerText = notes[index];
                box.style.opacity = 1;
                box.style.transform = "translateY(0)";
                document.getElementById("counterText").innerText = `Note ${index + 1} of ${notes.length}`;
            }, 200);
        }

        document.getElementById("messageBox").style.transition = "all 0.3s ease";
    </script>
</body>
</html>
